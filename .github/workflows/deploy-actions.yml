name: Déploiement Pages (voie Actions)

# Voie de secours : déploiement direct via l'API Pages (actions/deploy-pages),
# sans passer par le pipeline « build from branch » de GitHub.
on:
  workflow_dispatch:
  push:
    branches: [claude/oh-s5aavh]
    paths: ['.github/workflows/deploy-actions.yml']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
