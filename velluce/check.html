<!doctype html>
<meta charset="utf-8">
<style>body{margin:0;background:#0d1f26;display:grid;grid-template-columns:repeat(4,1fr)}div{position:relative}span{position:absolute;left:6px;top:6px;color:#9fd8e0;font:11px sans-serif;z-index:2;max-width:90%}canvas{width:100%;height:100%;display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/examples/":"/node_modules/three/examples/"}}</script>
<body>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'
const HANDLES = ['plafonnier-blanc-moderne-6-spots-orientables-modele-arvella','plafonnier-noir-moderne-4-spots-orientables-modele-virelia','plafonnier-moderne-acier-blanc-orientable-sejour-orpheane','plafonnier-spot-moderne-noir-orientable-modele-nerava','suspension-cylindrique-noire-3-lumieres-modele-arothis','suspension-cylindrique-noire-moderne-modele-neralis','suspension-cylindre-acier-noir-moderne-modele-neralis','suspension-beton-gris-style-loft-modele-arkemia','lustre-industriel-noir-6-lampes-salon-modele-neravio','suspension-acrylique-transparent-en-9-coloris','suspension-wabi-sabi-beton']
const loader = new GLTFLoader()
let done = 0
for (const h of HANDLES) {
  const cell = document.createElement('div')
  cell.style.height = (innerHeight / 3) + 'px'
  cell.innerHTML = `<span>${h.slice(0, 40)}</span>`
  const canvas = document.createElement('canvas')
  cell.appendChild(canvas)
  document.body.appendChild(cell)
  const r = new THREE.WebGLRenderer({ canvas, antialias: true })
  r.setSize(cell.clientWidth, cell.clientHeight, false)
  r.outputColorSpace = THREE.SRGBColorSpace
  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x12262e)
  scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture
  scene.add(new THREE.HemisphereLight(0xdfeef2, 0x223038, 1.1))
  const key = new THREE.DirectionalLight(0xfff1df, 2.2); key.position.set(2, 4, 3); scene.add(key)
  const cam = new THREE.PerspectiveCamera(35, cell.clientWidth / cell.clientHeight, 0.01, 50)
  loader.load(`/velluce/models/${h}.glb`, (g) => {
    scene.add(g.scene)
    // Boîte du luminaire seul : on ignore l'ancre invisible posée au sol.
    const bb = new THREE.Box3()
    g.scene.traverse((o) => {
      if (!o.isMesh) return
      const ob = new THREE.Box3().setFromObject(o)
      if (ob.max.y < 0.05) return
      bb.union(ob)
    })
    const c = bb.getCenter(new THREE.Vector3())
    const size = bb.getSize(new THREE.Vector3())
    const d = Math.max(size.x, size.y * 1.4, size.z, 0.35) * 1.7 + 0.35
    cam.position.set(c.x + d * 0.55, c.y + d * 0.18, c.z + d * 0.85)
    cam.lookAt(c)
    r.render(scene, cam)
    if (++done === HANDLES.length) document.title = 'READY'
  })
}
</script>
